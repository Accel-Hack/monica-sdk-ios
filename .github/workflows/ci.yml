name: ci

# Swift SDK の検査。見るのは 2 つ。
#
#   - test: macOS で `swift test`（契約テストを含む）が通り、iOS 13 simulator 向けに
#           コンパイルできること。契約テストは spec/ の vendoring したコピーを読むだけ
#           なので network は要らない
#   - spec: 取り込んだ公開契約が配信元から動いていないこと
#
# Swift のツールチェーンと XCTest は macOS にしか無く、macOS runner は Linux の
# 10 倍の課金になる。この repository は SDK そのものなので paths で絞る余地は無いが、
# schedule では test を回さない（契約の drift は spec job だけで分かる）。
# Linux 用 Swift で代替しない理由: UIKit の分岐と CryptoKit が無く、実際の配布先と
# 条件が変わる。

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 公開契約は MONICA 側の都合で動く。PR が来るまで気付かないと、
    # 気付いたときには「無関係な PR が落ちる」形で出てくる。
    - cron: "23 21 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Swift SDK / Xcode
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: 取り込んだ specが lockと一致するか
        # 契約テストも同じ照合をするが、こちらの方が落ちた理由が読みやすい。
        run: python3 scripts/spec-sync.py --check

      # swift test がテストごとビルドするので、別に swift build は走らせない
      - name: Swift SDK を検証
        run: |
          swift --version
          swift test

      - name: iOS 向けにコンパイルできることを確認
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swift build --scratch-path .build-ios \
            -Xswiftc -sdk -Xswiftc "$SDK" -Xswiftc -target -Xswiftc arm64-apple-ios13.0-simulator \
            -Xcc -isysroot -Xcc "$SDK" -Xcc -target -Xcc arm64-apple-ios13.0-simulator

  spec:
    # 配信元を叩くので test から切り離してある。network の失敗で macOS job が
    # 道連れになると、落ちた理由が読めなくなる。
    name: 公開契約
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: 取り込んだ specが配信元と一致するか
        # spec/ は https://spec.monica.accelhack.net/v1/ のコピー。配信元の
        # index.json の revision を取り込み済みのものと比べるだけなので安い。
        # ここが落ちたら python3 scripts/spec-sync.py で取り込み直し、
        # swift test を通してから commit する。
        run: python3 scripts/spec-sync.py --check-remote
