name: ci

# macOS で `swift test`（契約テストを含む）が通り、iOS 15 simulator 向けに
# コンパイルできることを見る。契約テストは spec/ の vendoring したコピーを
# 読むだけなので network は要らない。
#
# Linux 用 Swift で代替しない理由: UIKit の分岐と CryptoKit が無く、実際の
# 配布先と条件が変わる。
#
# 取り込んだ spec/ が配信元と一致しているかも照合する。MONICA 側で公開契約が
# 動いても、取り込み直すまで誰も気付かないことがあったため。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Swift SDK / Xcode
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: 取り込んだ specが lockと一致するか
        # 契約テストも同じ照合をするが、こちらの方が落ちた理由が読みやすい。
        run: python3 scripts/spec-sync.py --check

      - name: 取り込んだ spec が配信元と一致するか
        # ここが落ちたら python3 scripts/spec-sync.py で取り込み直し、swift test を通してから commit する
        run: python3 scripts/spec-sync.py --check-remote

      # swift test がテストごとビルドするので、別に swift build は走らせない
      - name: Swift SDK を検証
        run: |
          swift --version
          swift test

      - name: iOS 向けにコンパイルできることを確認
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swift build --scratch-path .build-ios \
            -Xswiftc -sdk -Xswiftc "$SDK" -Xswiftc -target -Xswiftc arm64-apple-ios15.0-simulator \
            -Xcc -isysroot -Xcc "$SDK" -Xcc -target -Xcc arm64-apple-ios15.0-simulator
